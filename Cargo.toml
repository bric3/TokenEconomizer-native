[package]
name = "tokeneconomizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Native experience-driven cost control for coding agents"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fancy-regex = { version = "0.20", default-features = false, features = ["std", "unicode", "perf"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
md5 = "0.8"
regex = "1"
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha1 = "0.10"
sha2 = "0.10"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[[bin]]
name = "te-bridge"
path = "src/bin/bridge.rs"

[[bin]]
name = "te-repomap-gen"
path = "src/bin/repomap_gen.rs"

[[bin]]
name = "te"
path = "src/bin/te.rs"

[[bin]]
name = "te-hook"
path = "src/bin/hook.rs"

[[bin]]
name = "te-package"
path = "src/bin/package.rs"

[[bin]]
name = "te-console-probe"
path = "validation/console_probe.rs"
