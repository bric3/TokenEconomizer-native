[package]
name = "tokeneconomizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Native experience-driven cost control for coding agents"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fancy-regex = { version = "0.20", default-features = false, features = ["std", "unicode", "perf"] }
indexmap = { version = "2", features = ["serde"] }
md5 = "0.8"
regex = "1"
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[[bin]]
name = "te-bridge"
path = "src/bin/bridge.rs"
