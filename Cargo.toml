[package]
name = "tokeneconomizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Native experience-driven cost control for coding agents"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[[bin]]
name = "te-bridge"
path = "src/bin/bridge.rs"
